# Built by `make build-serif` (scripts/build-geist-serif.py), not gftools builder: fontmake alone breaks the
# corner-component serifs. `make build` skips this config. It documents the family and its STAT for Google Fonts.
sources:
  - GeistSerif.glyphspackage
outputDir: ../fonts/GeistSerif
familyName: "Geist Serif"
cleanUp: true
buildStatic: false
stat:
  - name: Element Shape
    tag: ELSH
    values:
    - name: Regular
      value: 0
      flags: 2
    - name: Square
      value: 25
    - name: Triangle
      value: 50
    - name: Heart
      value: 100
